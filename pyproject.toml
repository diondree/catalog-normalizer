[project]
name = "catalog-normalizer"
version = "0.1.0"
description = "Fault-tolerant normalization and validation for messy product CSV data"
readme = "README.md"

requires-python = ">=3.13"

license = "MIT"
license-files = ["LICENSE"]

authors = [{ name = "Diondre Edwards", email = "diondredev@gmail.com" }]

keywords = [
  "catalog",
  "products",
  "csv",
  "normalization",
  "data-validation",
  "inventory",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["pydantic>=2.13.5,<3"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests"]

[project.urls]
Homepage = "https://github.com/diondree/catalog-normalizer"
Repository = "https://github.com/diondree/catalog-normalizer"
Issues = "https://github.com/diondree/catalog-normalizer/issues"
