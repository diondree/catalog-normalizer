[project]
name = "catalog-normalizer"
version = "0.1.0"
description = "Fault-tolerant normalization and validation for messy product CSV data"
readme = "README.md"
authors = [{ name = "Diondre Edwards", email = "diondredev@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["pydantic>=2.13.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
]
